site_name: FAIRmat-events-form
site_description: This is a plugin to enable collection of events requests from FAIRmat members using NOMAD
site_author: Ahmed Mansour

repo_url: https://github.com/ahm531/FAIRmat-events-form
edit_uri: ""

nav:
  - Home: index.md
  - Instructions: tutorial/tutorial.md
  - Reference: reference/references.md
  - Travel Information: travel_information/travel_information.md
plugins:
  - search
  - glightbox
theme:
  name: material
  palette:
    primary: "#2A4CDF"
    accent: "#008A67"
  font:
    text: "Titillium Web"
  logo: assets/nomad-plugin-logo.png
  favicon: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.path
    - navigation.footer
    - navigation.top
  custom_dir: docs/theme
  icon:
    repo: fontawesome/brands/github
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: True
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - mkdocs-click
  - pymdownx.extra
extra:
  generator: false
  homepage: https://nomad-lab.eu
use_directory_urls: false
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - create-image-sliders.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
